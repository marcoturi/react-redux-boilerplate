minimumReleaseAge: 1440

engineStrict: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Predates provenance
  - semver@6.3.1

packageExtensions:
  "@semantic-release/commit-analyzer":
    dependencies:
      conventional-changelog-conventionalcommits: ^9.2.0
  "@semantic-release/release-notes-generator":
    dependencies:
      conventional-changelog-conventionalcommits: ^9.2.0
